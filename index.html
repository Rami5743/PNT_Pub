<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משפט המספרים הראשוניים</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  /* DejaVu Sans with a subscript %: "p₁%(n)" is shown with the 1 and the % in
     the index (built by the manim-video skill's subfont.py) */
  @font-face {
    font-family: "Subtitle Sans";
    src: url("fonts/SubtitleSans.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --bg: #0e0f12;
    --panel: #17191e;
    --line: #2a2d34;
    --text: #e8e6e1;
    --muted: #9a9ca3;
    --accent: #e6c35c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    line-height: 1.5;
  }
  header { padding: 16px 16px 8px; max-width: 1280px; margin: 0 auto; }
  .langs { display: flex; gap: 8px; margin-bottom: 12px; }
  .langs button {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px 5px 8px; font: inherit; font-size: 0.9rem; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .langs svg { height: 16px; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 600; }
  h1 span { color: var(--accent); }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 20px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 16px 40px;
  }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }

  .player { min-width: 0; }
  video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 6px;
    display: block;
  }
  video::cue {
    font-family: "Subtitle Sans", "Assistant", "Segoe UI", Arial, sans-serif;
    background: rgba(0, 0, 0, 0.55);
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    margin-top: 12px;
  }
  .bar h2 { margin: 0; font-size: 1.15rem; font-weight: 600; flex: 1 1 auto; }
  .bar label { color: var(--muted); font-size: 0.95rem; }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 5px 8px;
    font: inherit;
  }
  .downloads { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }
  .downloads a { color: var(--muted); }
  .downloads a:hover { color: var(--text); }

  nav {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    align-self: start;
  }
  nav button {
    display: flex;
    width: 100%;
    gap: 10px;
    align-items: baseline;
    text-align: start;
    background: none;
    border: 0;
    border-radius: 4px;
    color: var(--text);
    font: inherit;
    padding: 7px 10px;
    cursor: pointer;
  }
  nav button:hover { background: #22252b; }
  nav button[aria-current="true"] { background: #2b2717; color: var(--accent); }
  nav .num { color: var(--muted); min-width: 1.6em; font-variant-numeric: tabular-nums; }
  nav .title { flex: 1; }
  nav .time { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; direction: ltr; }
  nav .full { font-weight: 600; border-bottom: 1px solid var(--line); border-radius: 4px 4px 0 0; margin-bottom: 4px; }
  nav .hint { color: var(--muted); font-size: 0.8rem; padding: 4px 10px 8px; }
  .error { color: #e08a7a; }
</style>
</head>
<body>
<header>
  <div class="langs" role="group" aria-label="שפה / Language">
    <button type="button" data-set="he" aria-pressed="true" title="עברית">
      <svg viewBox="0 0 220 160" style="width:22px" aria-hidden="true"><rect width="220" height="160" fill="#fff"/><rect y="15" width="220" height="25" fill="#0038b8"/><rect y="120" width="220" height="25" fill="#0038b8"/><g fill="none" stroke="#0038b8" stroke-width="5.5"><path d="M110 52 L136.5 98 L83.5 98 Z"/><path d="M110 108 L83.5 62 L136.5 62 Z"/></g></svg>
      <span>עברית</span>
    </button>
    <button type="button" data-set="en" aria-pressed="false" title="English">
      <svg viewBox="0 0 190 100" style="width:30px" aria-hidden="true"><rect width="190" height="100" fill="#fff"/><rect y="0.000" width="190" height="7.692" fill="#B22234"/><rect y="15.385" width="190" height="7.692" fill="#B22234"/><rect y="30.769" width="190" height="7.692" fill="#B22234"/><rect y="46.154" width="190" height="7.692" fill="#B22234"/><rect y="61.538" width="190" height="7.692" fill="#B22234"/><rect y="76.923" width="190" height="7.692" fill="#B22234"/><rect y="92.308" width="190" height="7.692" fill="#B22234"/><rect width="76" height="53.846" fill="#3C3B6E"/><g fill="#fff"><circle cx="6.33" cy="5.38" r="2.2"/><circle cx="19.00" cy="5.38" r="2.2"/><circle cx="31.67" cy="5.38" r="2.2"/><circle cx="44.33" cy="5.38" r="2.2"/><circle cx="57.00" cy="5.38" r="2.2"/><circle cx="69.67" cy="5.38" r="2.2"/><circle cx="12.67" cy="10.77" r="2.2"/><circle cx="25.33" cy="10.77" r="2.2"/><circle cx="38.00" cy="10.77" r="2.2"/><circle cx="50.67" cy="10.77" r="2.2"/><circle cx="63.33" cy="10.77" r="2.2"/><circle cx="6.33" cy="16.15" r="2.2"/><circle cx="19.00" cy="16.15" r="2.2"/><circle cx="31.67" cy="16.15" r="2.2"/><circle cx="44.33" cy="16.15" r="2.2"/><circle cx="57.00" cy="16.15" r="2.2"/><circle cx="69.67" cy="16.15" r="2.2"/><circle cx="12.67" cy="21.54" r="2.2"/><circle cx="25.33" cy="21.54" r="2.2"/><circle cx="38.00" cy="21.54" r="2.2"/><circle cx="50.67" cy="21.54" r="2.2"/><circle cx="63.33" cy="21.54" r="2.2"/><circle cx="6.33" cy="26.92" r="2.2"/><circle cx="19.00" cy="26.92" r="2.2"/><circle cx="31.67" cy="26.92" r="2.2"/><circle cx="44.33" cy="26.92" r="2.2"/><circle cx="57.00" cy="26.92" r="2.2"/><circle cx="69.67" cy="26.92" r="2.2"/><circle cx="12.67" cy="32.31" r="2.2"/><circle cx="25.33" cy="32.31" r="2.2"/><circle cx="38.00" cy="32.31" r="2.2"/><circle cx="50.67" cy="32.31" r="2.2"/><circle cx="63.33" cy="32.31" r="2.2"/><circle cx="6.33" cy="37.69" r="2.2"/><circle cx="19.00" cy="37.69" r="2.2"/><circle cx="31.67" cy="37.69" r="2.2"/><circle cx="44.33" cy="37.69" r="2.2"/><circle cx="57.00" cy="37.69" r="2.2"/><circle cx="69.67" cy="37.69" r="2.2"/><circle cx="12.67" cy="43.08" r="2.2"/><circle cx="25.33" cy="43.08" r="2.2"/><circle cx="38.00" cy="43.08" r="2.2"/><circle cx="50.67" cy="43.08" r="2.2"/><circle cx="63.33" cy="43.08" r="2.2"/><circle cx="6.33" cy="48.46" r="2.2"/><circle cx="19.00" cy="48.46" r="2.2"/><circle cx="31.67" cy="48.46" r="2.2"/><circle cx="44.33" cy="48.46" r="2.2"/><circle cx="57.00" cy="48.46" r="2.2"/><circle cx="69.67" cy="48.46" r="2.2"/></g></svg>
      <span>English</span>
    </button>
  </div>
  <h1 id="site-title">משפט המספרים הראשוניים</h1>
</header>
<main>
  <section class="player">
    <video id="video" controls preload="metadata" playsinline crossorigin="anonymous"></video>
    <div class="bar">
      <h2 id="now-title"></h2>
      <label for="subs" id="subs-label">כתוביות</label>
      <select id="subs"><option value="">ללא</option></select>
    </div>
    <div class="downloads" id="downloads"></div>
  </section>
  <nav id="list" aria-label="סרטונים"></nav>
</main>

<script>
(function () {
  "use strict";

  var video = document.getElementById("video");
  var subsSelect = document.getElementById("subs");
  var list = document.getElementById("list");
  var nowTitle = document.getElementById("now-title");
  var downloads = document.getElementById("downloads");

  var root = document.documentElement;
  var UI = {
    he: { dir: "rtl", subs: "כתוביות", none: "ללא", videos: "סרטונים",
          scenes: "הסצנות, כל אחת כסרטון נפרד:", download: "הורדת הסרטון",
          subsFile: "כתוביות", error: "לא ניתן לטעון את רשימת הסרטונים (manifest.json)." },
    en: { dir: "ltr", subs: "Subtitles", none: "None", videos: "Videos",
          scenes: "The scenes, each as a separate video:", download: "Download the video",
          subsFile: "Subtitles", error: "Could not load the list of videos (manifest.json)." }
  };
  // The page opens in Hebrew (the owner's choice), or in English with #en in
  // the address. Choosing a language also sets the subtitles to it.
  var lang = location.hash === "#en" ? "en" : "he";
  var currentFound = [];       // the subtitle languages the current video has

  var manifest = null;
  var current = null;          // the entry being played
  var vttCache = {};           // "<lang>/<id>" -> blob URL, or null if absent
  // The page opens on the whole video with Hebrew subtitles (the owner's
  // choice). A change of subtitles then holds while the viewer switches videos.
  var wantedSubs = lang;

  function t(key) { return UI[lang][key]; }
  // The video in the page's language: the English version differs only in
  // the words on screen, and a scene without words shares the Hebrew file.
  function fileOf(entry) { return (entry.files && entry.files[lang]) || entry.file; }
  function titleOf(entry) { return (entry.titles && entry.titles[lang]) || entry.title; }

  function clock(seconds) {
    var s = Math.round(seconds);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  // SRT -> WebVTT: a header, and a dot for the comma in each timestamp.
  function srtToVtt(srt) {
    var body = srt.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n")
      .replace(/(\d\d:\d\d:\d\d),(\d\d\d)/g, "$1.$2");
    return "WEBVTT\n\n" + body;
  }

  function subtitleUrl(lang, id) {
    var key = lang + "/" + id;
    if (key in vttCache) return Promise.resolve(vttCache[key]);
    return fetch("subtitles/" + key + ".srt")
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (text) {
        var url = text === null ? null
          : URL.createObjectURL(new Blob([srtToVtt(text)], { type: "text/vtt" }));
        vttCache[key] = url;
        return url;
      })
      .catch(function () { vttCache[key] = null; return null; });
  }

  function language(code) {
    return manifest.languages.filter(function (l) { return l.code === code; })[0];
  }

  // Show the chosen language's track, hide the others.
  function applySubtitleChoice() {
    var chosen = subsSelect.value;
    for (var i = 0; i < video.textTracks.length; i++) {
      var t = video.textTracks[i];
      t.mode = t.language === chosen ? "showing" : "disabled";
    }
  }

  function play(entry, startAt, autoplay) {
    current = entry;
    showTitle();

    Array.prototype.forEach.call(list.querySelectorAll("button[data-id]"), function (b) {
      b.setAttribute("aria-current", b.dataset.id === entry.id ? "true" : "false");
    });

    Array.prototype.forEach.call(video.querySelectorAll("track"), function (t) { t.remove(); });
    video.src = fileOf(entry);
    if (startAt) {
      video.addEventListener("loadedmetadata", function seek() {
        video.removeEventListener("loadedmetadata", seek);
        video.currentTime = startAt;
      });
    }

    downloads.innerHTML = "";
    currentFound = [];

    var wanted = wantedSubs;
    subsSelect.length = 1;
    Promise.all(manifest.languages.map(function (lang) {
      return subtitleUrl(lang.code, entry.id).then(function (url) {
        return { lang: lang, url: url };
      });
    })).then(function (found) {
      if (current !== entry) return;
      found.forEach(function (f) {
        if (!f.url) return;
        var track = document.createElement("track");
        track.kind = "subtitles";
        track.srclang = f.lang.code;
        track.label = f.lang.label;
        track.src = f.url;
        video.appendChild(track);
        var opt = document.createElement("option");
        opt.value = f.lang.code;
        opt.textContent = f.lang.label;
        subsSelect.appendChild(opt);
        currentFound.push(f.lang);
      });
      var available = Array.prototype.some.call(subsSelect.options,
        function (o) { return o.value === wanted; });
      subsSelect.value = available ? wanted : "";
      // Tracks are registered asynchronously in some browsers.
      setTimeout(applySubtitleChoice, 0);
      applySubtitleChoice();
      showDownloads();
    });

    if (autoplay) video.play().catch(function () {});
  }

  function showTitle() {
    if (!current) return;
    nowTitle.textContent = current.number ? current.number + ". " + titleOf(current) : titleOf(current);
  }

  function showDownloads() {
    if (!current) return;
    var links = ['<a href="' + fileOf(current) + '" download></a>'];
    currentFound.forEach(function (l) {
      links.push('<a href="subtitles/' + l.code + "/" + current.id + '.srt" download></a>');
    });
    downloads.innerHTML = links.join(" · ");
    var a = downloads.querySelectorAll("a");
    a[0].textContent = t("download");
    currentFound.forEach(function (l, i) { a[i + 1].textContent = t("subsFile") + " (" + l.label + ")"; });
  }

  // Switch the page to a language: its text, its direction, the titles, and
  // the subtitles, which follow the language chosen.
  function setLang(next) {
    lang = UI[next] ? next : "he";
    root.lang = lang;
    root.dir = t("dir");
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.set === lang ? "true" : "false");
    });
    document.getElementById("subs-label").textContent = t("subs");
    subsSelect.options[0].textContent = t("none");
    list.setAttribute("aria-label", t("videos"));
    if (manifest) {
      var title = (manifest.titles && manifest.titles[lang]) || manifest.title;
      document.title = title;
      document.getElementById("site-title").textContent = title;
      list.querySelectorAll("button[data-id]").forEach(function (b) {
        b.querySelector(".title").textContent = titleOf(b._entry);
      });
      var hint = list.querySelector(".hint");
      if (hint) hint.textContent = t("scenes");
    }
    showTitle();
    showDownloads();
    // the same moment, in the version of the new language
    if (current && video.getAttribute("src") && video.getAttribute("src") !== fileOf(current)) {
      var at = video.currentTime, wasPlaying = !video.paused;
      var tracks = Array.prototype.slice.call(video.querySelectorAll("track"));
      video.src = fileOf(current);
      tracks.forEach(function (tr) { video.appendChild(tr); });
      video.addEventListener("loadedmetadata", function resume() {
        video.removeEventListener("loadedmetadata", resume);
        video.currentTime = at;
        applySubtitleChoice();
        if (wasPlaying) video.play().catch(function () {});
      });
    }
    wantedSubs = lang;
    if (Array.prototype.some.call(subsSelect.options, function (o) { return o.value === lang; })) {
      subsSelect.value = lang;
      applySubtitleChoice();
    }
  }

  function button(entry, extraClass, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.id = entry.id;
    if (extraClass) b.className = extraClass;
    b.innerHTML =
      '<span class="num">' + (entry.number ? String(entry.number) : "") + "</span>" +
      '<span class="title"></span>' +
      '<span class="time">' + clock(entry.duration) + "</span>";
    b._entry = entry;
    b.querySelector(".title").textContent = titleOf(entry);
    b.addEventListener("click", onClick);
    return b;
  }

  function build() {

    var full = manifest.full;
    list.appendChild(button(full, "full", function () { play(full, 0, true); }));
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = t("scenes");
    list.appendChild(hint);
    manifest.scenes.forEach(function (scene) {
      list.appendChild(button(scene, "", function () { play(scene, 0, true); }));
    });

    subsSelect.addEventListener("change", function () {
      wantedSubs = subsSelect.value;
      applySubtitleChoice();
    });

    setLang(lang);
    play(full, 0, false);
  }

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      setLang(b.dataset.set);
      history.replaceState(null, "", b.dataset.set === "he" ? location.pathname : "#en");
    });
  });
  setLang(lang);

  fetch("manifest.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (m) { manifest = m; build(); })
    .catch(function (e) {
      nowTitle.innerHTML = '<span class="error"></span>';
      nowTitle.firstChild.textContent = t("error");
    });
})();
</script>
</body>
</html>
